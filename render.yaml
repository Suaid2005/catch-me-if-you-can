
services:
  - type: web
    name: catch-me-if-you-can-backend
    runtime: python
    region: singapore
    plan: free

    buildCommand: "cd backend && pip install -r requirements.txt"

    startCommand: "cd backend && uvicorn app.main:socket_app --host 0.0.0.0 --port $PORT --workers 1"

    healthCheckPath: /health

    envVars:
      - key: PYTHON_VERSION
        value: 3.12.2

      - key: APP_ENV
        value: production

      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        sync: false

      - key: ENABLE_HEAVY_EMBEDDINGS
        value: "false"

      - key: FRONTEND_URL
        sync: false

      - key: ALLOWED_ORIGINS
        sync: false
